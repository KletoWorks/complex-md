name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      # Git on the Windows runner already defaults to core.autocrlf=true.
      # Node 22 keeps it, so the tests meet a CRLF checkout as most Windows
      # users have it. Node 24 sets false, so 1 Windows leg runs on LF files.
      - name: Set Windows line endings
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf ${{ matrix.node == 22 && 'true' || 'false' }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: cli
      - run: npm test
        working-directory: cli
      - run: npm ci
        working-directory: packages/complex-md-mcp
      - run: npm test
        working-directory: packages/complex-md-mcp
      - run: npm run build
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
  # `bunx complex.md` runs the CLI on Bun, not Node. This job runs the CLI
  # suite under Bun so that path stays tested. Bun's node:test has no
  # t.skip() yet (oven-sh/bun#5090), so the job gives the tests what they
  # would skip without: the full history and ripgrep.
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y ripgrep
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun bin/complex-md.js --version
        working-directory: cli
      - run: bun test
        working-directory: cli
