# Publish to npm when a version tag is pushed. Uses npm trusted publishing
# (OIDC): no token in secrets, no second factor prompt, provenance attached.
# The tag must match cli/package.json, and the package must be configured on
# npmjs.com with this repository and workflow as its trusted publisher.
# After the publish job succeeds, the github-release job creates the
# GitHub release from the version's section in CHANGELOG.md.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5 or later; Node 22 ships npm 10.
      # An exact version, so every release builds with the same npm.
      - run: npm install -g npm@11.21.1 && npm --version
      - name: tag matches package version
        run: |
          cli=$(node -p "require('./cli/package.json').version")
          mcp=$(node -p "require('./packages/complex-md-mcp/package.json').version")
          [ "$cli" = "$mcp" ] || { echo "cli/package.json $cli does not match complex-md-mcp/package.json $mcp"; exit 1; }
          [ "refs/tags/v$cli" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF does not match package version $cli"; exit 1; }
      # The release notes come from this section, so a release without one
      # stops here, before anything is published.
      - name: CHANGELOG.md has a section for the version
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /dev/null
      - run: cd cli && npm ci && npm test
      - run: cd packages/complex-md-mcp && npm ci && npm test
      - run: npm run build
      - run: cd cli && npm publish --access public --provenance
      - run: cd packages/complex-md-mcp && npm publish --access public --provenance
      # The same CLI build under the name complex.md, so `npx complex.md` works.
      # Trusted publishing needs a package that exists: the maintainer makes the
      # first publish by hand and adds this workflow as its trusted publisher.
      # Until then the step skips and the release stays green.
      - name: publish complex.md
        run: |
          if npm view complex.md version >/dev/null 2>&1; then
            cd cli && npm pkg set name=complex.md && npm publish --access public --provenance
          else
            echo "complex.md is not on npm yet; skipped"
          fi
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    # The only job that writes to the repository: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # A re-run of this job edits the release that the first run created.
      - name: create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "complex-md ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "complex-md ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
