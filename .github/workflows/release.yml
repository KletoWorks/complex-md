# Publish to npm when a version tag is pushed. Uses npm trusted publishing
# (OIDC): no token in secrets, no second factor prompt, provenance attached.
# The tag must match cli/package.json, and the package must be configured on
# npmjs.com with this repository and workflow as its trusted publisher.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5 or later; Node 22 ships npm 10.
      # An exact version, so every release builds with the same npm.
      - run: npm install -g npm@11.21.1 && npm --version
      - name: tag matches package version
        run: |
          cli=$(node -p "require('./cli/package.json').version")
          mcp=$(node -p "require('./packages/complex-md-mcp/package.json').version")
          [ "$cli" = "$mcp" ] || { echo "cli/package.json $cli does not match complex-md-mcp/package.json $mcp"; exit 1; }
          [ "refs/tags/v$cli" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF does not match package version $cli"; exit 1; }
      - run: cd cli && npm ci && npm test
      - run: cd packages/complex-md-mcp && npm ci && npm test
      - run: npm run build
      - run: cd cli && npm publish --access public --provenance
      - run: cd packages/complex-md-mcp && npm publish --access public --provenance
